<svg width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="#2980b9"/>
  <circle cx="128" cy="128" r="110" fill="#3498db"/>

  <!-- Wrench -->
  <g transform="translate(70, 80) rotate(-45, 30, 40)">
    <rect x="25" y="10" width="10" height="60" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
    <circle cx="30" cy="15" r="12" fill="none" stroke="#ecf0f1" stroke-width="8"/>
    <circle cx="30" cy="15" r="8" fill="#2980b9"/>
  </g>

  <!-- Screwdriver -->
  <g transform="translate(120, 70) rotate(45, 30, 40)">
    <rect x="27" y="10" width="6" height="50" fill="#e74c3c"/>
    <polygon points="25,60 35,60 30,75" fill="#95a5a6"/>
    <rect x="26" y="75" width="8" height="3" fill="#7f8c8d"/>
  </g>

  <!-- Gear -->
  <g transform="translate(128, 160)">
    <circle cx="0" cy="0" r="35" fill="#ecf0f1"/>
    <!-- Gear teeth -->
    <circle cx="0" cy="-35" r="6" fill="#ecf0f1"/>
    <circle cx="25" cy="-25" r="6" fill="#ecf0f1"/>
    <circle cx="35" cy="0" r="6" fill="#ecf0f1"/>
    <circle cx="25" cy="25" r="6" fill="#ecf0f1"/>
    <circle cx="0" cy="35" r="6" fill="#ecf0f1"/>
    <circle cx="-25" cy="25" r="6" fill="#ecf0f1"/>
    <circle cx="-35" cy="0" r="6" fill="#ecf0f1"/>
    <circle cx="-25" cy="-25" r="6" fill="#ecf0f1"/>
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="15" fill="#2980b9"/>
    <circle cx="0" cy="0" r="8" fill="#34495e"/>
  </g>

  <!-- Highlight -->
  <ellipse cx="100" cy="80" rx="40" ry="50" fill="white" opacity="0.2"/>
</svg>
